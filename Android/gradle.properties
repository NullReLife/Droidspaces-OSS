# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=512m
android.useAndroidX=true
kotlin.code.style=official

# Performance optimizations
org.gradle.parallel=true
org.gradle.caching=true

# Keystore configuration for signing: set these here, in ~/.gradle/gradle.properties
# or with -P on the command line
# KEYSTORE_PASSWORD=your_keystore_password
# KEY_PASSWORD=your_key_password (or same as KEYSTORE_PASSWORD)
# KEY_ALIAS=droidspaces
